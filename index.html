<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Reminder Launcher</title>
</head>
<body>
<h1>AI Reminder Launcher</h1>
<p id="status">Preparing Apple Shortcuts…</p>
<p><a id="launch" href="shortcuts://run-shortcut?name=AI_Reminder">Run AI_Reminder manually</a></p>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('json');
  const status = document.getElementById('status');
  const link = document.getElementById('launch');
  let target = 'shortcuts://run-shortcut?name=AI_Reminder';
  if (raw !== null) {
    try {
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object' || Array.isArray(obj) || typeof obj.title !== 'string' || !obj.title.trim()) throw new Error('JSON needs a nonempty title');
      target += '&input=text&text=' + encodeURIComponent(JSON.stringify(obj));
      status.textContent = 'Launching AI_Reminder with supplied JSON…';
    } catch (err) {
      status.textContent = 'Invalid reminder JSON: ' + err.message + '. Shortcut not launched.';
      link.hidden = true;
      return;
    }
  } else {
    status.textContent = 'Launching AI_Reminder with clipboard fallback…';
  }
  link.href = target;
  window.location.href = target;
})();
</script>
</body>
</html>
